services:
  app:
    build: .
    ports:
      - "${APP_PORT:-18209}:8000"
    environment:
      TRACE_DB: /data/trace.sqlite
    volumes:
      - records:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  records:
