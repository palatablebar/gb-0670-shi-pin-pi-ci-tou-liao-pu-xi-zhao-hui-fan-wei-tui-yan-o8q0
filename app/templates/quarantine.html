{% extends "base.html" %}{% block content %}<div class="grid quarantine-grid"><section class="panel"><div class="panel__head"><h2>05 / 异常记录</h2><input class="filter" placeholder="筛选原因码" aria-label="筛选隔离记录"></div><div class="table-scroll"><table class="ledger"><thead><tr><th>行号</th><th>原因码</th><th>判定</th><th>原值</th></tr></thead><tbody>{% for row in data.quarantine %}<tr class="issue"><td class="num">{{ row.line }}</td><td><code>{{ row.reason }}</code></td><td>{{ row.message }}</td><td class="raw" title="{{ row.raw }}">{{ row.raw }}</td></tr>{% else %}<tr><td colspan="4" class="empty">没有隔离记录。</td></tr>{% endfor %}</tbody></table></div></section><section class="panel"><div class="panel__head"><h2>处置登记</h2><span>版本 {{ data.review.version }}</span></div><div class="panel__body"><form id="review-form"><input type="hidden" name="version" value="{{ data.review.version }}"><label class="field">判定<select name="state"><option value="rejected">驳回</option><option value="approved">通过</option></select></label><label class="field">复核依据<textarea name="note" rows="4" maxlength="500">{{ data.review.note }}</textarea></label><button class="btn primary">提交复核</button></form></div></section><section class="panel stamp"><h2>当前状态</h2><strong>{{ data.review.state }}</strong><span>坏行不进入召回传播</span></section></div>{% endblock %}
